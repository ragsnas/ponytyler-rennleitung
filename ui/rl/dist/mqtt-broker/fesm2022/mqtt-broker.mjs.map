<h2>MQTT Broker</h2>

<p class="connection-status">Status: {{ connected ? 'Connected' : 'Disconnected' }}</p>

@if (messages.length > 0) {
  <ul class="messages">
    @for (message of messages; track message) {
      <li>
        <span class="topic">{{ message.topic }}</span>: <span class="payload">{{ message.payload }}</span>
      </li>
    }
  </ul>
} @else {
  <p>No messages received yet.</p>
}
