@if (songs && filteredOptions) {
  <form>
    <mat-form-field class="full-width">
      <mat-label>{{label}}</mat-label>
      <input type="text"
        placeholder="Pick a Song"
        aria-label="Pick a Song"
        matInput
        [formControl]="songControl"
        [matAutocomplete]="auto">
      <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
        @for (option of filteredOptions | async; track option) {
          <mat-option
            [value]="option"
            [disabled]="option.alreadyPlayed"
            [ngClass]="{'alreadyPlayed': option.alreadyPlayed, 'alreadyWished': option.alreadyWished }">
            {{option.artist}} - {{option.name}}
            @if (option.alreadyPlayed) {
              <mat-icon>block</mat-icon>
            }
            @if (option.alreadyWished) {
              <mat-icon>warning</mat-icon>
            }
          </mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>
  </form>
}
